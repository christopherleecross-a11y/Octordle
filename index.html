<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octordle</title>
    <script>
    function confetti(opts) {
        const canvas = document.createElement('canvas');
        canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const count = opts.particleCount || 150;
        const colors = ['#538d4e','#b59f3b','#e74c3c','#3498db','#f39c12','#9b59b6','#1abc9c','#e67e22'];
        const particles = Array.from({length: count}, () => ({
            x: canvas.width * (opts.origin ? (1 - opts.origin.y) : 0.5),
            y: canvas.height * (opts.origin ? opts.origin.y : 0.6),
            r: Math.random() * 8 + 4,
            d: Math.random() * count,
            color: colors[Math.floor(Math.random() * colors.length)],
            tilt: Math.random() * 10 - 10,
            tiltAngle: 0,
            tiltAngleIncrement: Math.random() * 0.07 + 0.05,
            vx: (Math.random() - 0.5) * (opts.spread || 70) * 0.12,
            vy: Math.random() * -8 - 4,
            gravity: 0.3,
            opacity: 1
        }));
        let frame;
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            particles.forEach(p => {
                p.vy += p.gravity;
                p.x += p.vx;
                p.y += p.vy;
                p.tiltAngle += p.tiltAngleIncrement;
                p.tilt = Math.sin(p.tiltAngle) * 12;
                p.opacity -= 0.008;
                if (p.opacity > 0 && p.y < canvas.height + 20) {
                    active = true;
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.opacity);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.ellipse(p.x, p.y, p.r, p.r * 0.4, p.tilt, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });
            if (active) { frame = requestAnimationFrame(draw); }
            else { canvas.remove(); }
        }
        draw();
    }
    </script>
    <style>
        :root {
            --correct: #538d4e;
            --present: #b59f3b;
            --absent: #3a3a3c;
            --bg: #121213;
            --tile-border: #3a3a3c;
            --key-bg: #818384;

        * { box-sizing: border-box; }
        html, body { background-color: #121213; color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        header { padding: 8px; font-weight: bold; letter-spacing: 2px; font-size: 1rem; border-bottom: 1px solid #3a3a3c; width: 100%; text-align: center; display: flex; align-items: center; justify-content: center; gap: 12px; }
        #mode-select { background: #2a2a2c; color: #ffffff; border: 1px solid #3a3a3c; border-radius: 4px; padding: 3px 8px; font-size: 0.75rem; font-family: inherit; cursor: pointer; letter-spacing: 1px; }
        #mode-select:focus { outline: none; border-color: #666; }
        #game-view { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 35px; padding: 15px; width: 95%; max-width: 1150px; margin-bottom: 240px; }
        .board-container { background: #1a1a1b; padding: 4px; border-radius: 4px; }
        .grid { display: grid; gap: 1px; }
        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; }
        .tile { width: 100%; aspect-ratio: 1; border: 1px solid #3a3a3c; display: flex; justify-content: center; align-items: center; font-size: 0.85rem; font-weight: bold; text-transform: uppercase; color: #ffffff; background: #121213; }
        .tile[data-state="correct"] { background: #538d4e; border-color: #538d4e; color: #fff; }
        .tile[data-state="present"] { background: #b59f3b; border-color: #b59f3b; color: #fff; }
        .tile[data-state="absent"] { background: #3a3a3c; border-color: #3a3a3c; color: #fff; }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-3px)} 40%,80%{transform:translateX(3px)} }
        #bottom-container { position: fixed; bottom: 0; width: 100%; background: #121213; border-top: 1px solid #3a3a3c; display: flex; justify-content: center; align-items: center; padding: 10px 0; z-index: 100; }
        #keyboard { display: flex; flex-direction: column; align-items: center; }
        .key-row { display: flex; justify-content: center; margin-bottom: 4px; }
        .key { background: #818384; color: #ffffff; border: none; border-radius: 4px; width: 38px; height: 58px; margin: 0 2px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 6px 0 4px 0; font-size: 0.8rem; transition: background-color 0.2s; }
        .key.large { width: 55px; justify-content: center; padding: 0; font-size: 0.75rem; height: 58px; }
        .key[data-state="correct"] { background: #538d4e; }
        .key[data-state="present"] { background: #b59f3b; }
        .key[data-state="absent"] { background: #3a3a3c; }
        .dot-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 1.5px; width: 28px; height: 14px; }
        .dot { width: 100%; height: 100%; border-radius: 1px; background: #2a2a2c; transition: background-color 0.2s; }
        .dot[data-state="correct"] { background: #538d4e; }
        .dot[data-state="present"] { background: #b59f3b; }
        .dot[data-state="absent"] { background: #505052; }
        #tracker { margin-left: 15px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding-left: 10px; border-left: 1px solid #3a3a3c; }
        .tracker-item { width: 28px; height: 28px; border: 2px solid #3a3a3c; color: #ffffff; background: #121213; display: flex; justify-content: center; align-items: center; font-weight: bold; border-radius: 4px; font-size: 0.8rem; }
        .tracker-item.solved { background: #538d4e; border-color: #538d4e; color: #fff; }

        .play-btn:hover { background: #6aad62; }

        .stats-content-wrap { position: relative; }

</div>

WITTY","WOKEN","WOMAN","WOMEN","WOMYN","WONKY","WOODY","WOOER","WOOLY","WOOZY","WORDY","WORLD","WORRY","WORSE","WORST","WORTH","WOULD","WOUND","WOVEN","WRACK","WRATH","WREAK","WRECK","WREST","WRING","WRIST","WRITE","WRONG","WROTE","WRUNG","WRYLY","XEROX","YACHT","YAHOO","YEAST","YIELD","YODEL","YOKEL","YOUNG","YOURN","YOURS","YOUTH","YUCCA","YUCKY","YUMMY","ZEBRA","ZESTY","ZILCH","ZONAL","CREME","DONUT","JUMBO","STOMP","ETHOS","LOGOS","JAZZY","PANDA","MACAW","OPTED","BIOME","HEFTY","GASSY","HIPPO","HYPER","HUNKY","GATOR","WORMY","FUZZY"]);

function pickTargets() {
    const pool = [...WORD_POOL], t = [];
    while (t.length < 8) { const i = Math.floor(Math.random()*pool.length); t.push(pool.splice(i,1)[0]); }
    return t;
}

let TARGET_WORDS = pickTargets();
let guesses = [], currentGuess = "", solved = new Array(8).fill(false), isGameOver = false, isSubmitting = false;
let globalKeyStates = {}, boardKeyStates = {};
const STATE_PRIORITY = { correct:3, present:2, absent:1 };

function updateCounter() {
    const r = maxGuesses - guesses.length;
    document.getElementById('guess-counter').textContent = `(${r} guess${r===1?'':'es'} left)`;
}

function init() {
    maxGuesses = MODE_GUESSES[modeSelect.value];
    const gv = document.getElementById('game-view'), tr = document.getElementById('tracker');
    for (let i = 0; i < 8; i++) {
        const c = document.createElement('div'); c.className = 'board-container';
        c.innerHTML = `<div style="font-size:8px;color:#888;margin-bottom:2px;text-align:center;">BOARD ${i+1}</div><div class="grid" id="grid-${i}" style="grid-template-rows:repeat(${maxGuesses},1fr);"></div>`;
        const g = c.querySelector('.grid');
        for (let r = 0; r < maxGuesses; r++) {
            const row = document.createElement('div'); row.className = 'row';
            for (let cc = 0; cc < 5; cc++) { const t = document.createElement('div'); t.className = 'tile'; row.appendChild(t); }
            g.appendChild(row);
        }
        gv.appendChild(c);
        const ti = document.createElement('div'); ti.className = 'tracker-item'; ti.id = `track-${i}`; ti.textContent = i+1; tr.appendChild(ti);
    }
    buildKeyboard(); updateCounter();
}

function buildKeyboard() {
    const layout = ["QWERTYUIOP".split(""), "ASDFGHJKL".split(""), ["ENTER", ..."ZXCVBNM".split(""), "DEL"]];
    ["r1","r2","r3"].forEach((id, i) => {
        const row = document.getElementById(id);
        layout[i].forEach(key => {
            const btn = document.createElement('button');
            btn.className = `key${key.length > 1 ? ' large' : ''}`;
            btn.id = `key-${key}`; btn.onclick = () => handleInput(key);
            if (key.length === 1) {
                const lbl = document.createElement('span'); lbl.textContent = key; btn.appendChild(lbl);
                const dg = document.createElement('div'); dg.className = 'dot-grid';
                for (let d = 0; d < 8; d++) { const dot = document.createElement('div'); dot.className = 'dot'; dot.id = `dot-${key}-${d}`; dg.appendChild(dot); }
                btn.appendChild(dg);
            } else { btn.textContent = key === "DEL" ? "⌫" : key; }
            row.appendChild(btn);
        });
    });
}

function handleInput(key) {
    if (isGameOver || isSubmitting) return;
    if (key === "ENTER") { if (currentGuess.length === 5) validateAndSubmit(); }
    else if (key === "DEL" || key === "BACKSPACE") { currentGuess = currentGuess.slice(0,-1); updateView(); }
    else if (currentGuess.length < 5 && /^[A-Z]$/.test(key.toUpperCase())) { currentGuess += key.toUpperCase(); updateView(); }
}

function validateAndSubmit() { if (!VALID_GUESSES.has(currentGuess)) { showShake(); return; } submitGuess(); }

function showShake() {
    for (let i = 0; i < 8; i++) {
        if (solved[i]) continue;
        const row = document.getElementById(`grid-${i}`).children[guesses.length];
        for (const t of row.children) { t.classList.add('shake'); setTimeout(() => t.classList.remove('shake'), 400); }
    }
}

function updateView() {
    for (let i = 0; i < 8; i++) {
        if (solved[i]) continue;
        const row = document.getElementById(`grid-${i}`).children[guesses.length];
        for (let c = 0; c < 5; c++) row.children[c].textContent = currentGuess[c] || "";
    }
}

function submitGuess() {
    isSubmitting = true;
    const ga = currentGuess.split("");
    for (let i = 0; i < 8; i++) {
        if (solved[i]) continue;
        const target = TARGET_WORDS[i], row = document.getElementById(`grid-${i}`).children[guesses.length];
        let states = new Array(5).fill("absent"), tc = {};
        for (const ch of target) tc[ch] = (tc[ch] || 0) + 1;
        for (let c = 0; c < 5; c++) if (ga[c] === target[c]) { states[c] = "correct"; tc[ga[c]]--; }
        for (let c = 0; c < 5; c++) if (states[c] !== "correct" && tc[ga[c]] > 0) { states[c] = "present"; tc[ga[c]]--; }
        states.forEach((s,c) => row.children[c].setAttribute('data-state', s));
        states.forEach((s,c) => updateKeyVisuals(ga[c], i, s));
        if (currentGuess === target) { solved[i] = true; document.getElementById(`track-${i}`).classList.add('solved'); }
    }
    guesses.push(currentGuess); currentGuess = ""; updateCounter();
    if (solved.every(s => s)) endGame(true);
    else if (guesses.length === maxGuesses) endGame(false);
    setTimeout(() => { isSubmitting = false; }, 100);
}

function updateKeyVisuals(char, boardIdx, state) {
    if (!boardKeyStates[char]) boardKeyStates[char] = {};
    const pb = boardKeyStates[char][boardIdx];
    if (!pb || STATE_PRIORITY[state] > STATE_PRIORITY[pb]) {
        boardKeyStates[char][boardIdx] = state;
        const dot = document.getElementById(`dot-${char}-${boardIdx}`);
        if (dot) dot.setAttribute('data-state', state);
    }
    const pg = globalKeyStates[char];
    if (!pg || STATE_PRIORITY[state] > STATE_PRIORITY[pg]) {
        globalKeyStates[char] = state;
        const kb = document.getElementById(`key-${char}`);
        if (kb) kb.setAttribute('data-state', state);
    }
}

function endGame(win) {
    isGameOver = true;
    lastWinGuess = win ? guesses.length : null;
    recordResult(currentMode, win, guesses.length, maxGuesses);
    setTimeout(() => {
        const modal = document.getElementById('modal'), title = document.getElementById('modal-title');
        modal.style.display = "flex";
        if (win) {
            title.textContent = "VICTORY!"; title.style.color = "#538d4e";
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        } else {
            title.textContent = "GAME OVER"; title.style.color = "#e74c3c";
            document.getElementById('answers-container').style.display = "block";
            const list = document.getElementById('ans-list');
            TARGET_WORDS.forEach((w, i) => {
                if (!solved[i]) { const d = document.createElement('div'); d.className = 'ans-item'; d.textContent = `Board ${i+1}: ${w}`; list.appendChild(d); }
            });
        }
    }, 400);
}

// ---- STATS ----
function getStats(mode) {
    const def = { played:0, wins:0, streak:0, maxStreak:0, dist:{} };
    try { return JSON.parse(localStorage.getItem('octordle_stats_'+mode)) || def; } catch(e) { return def; }
}
function saveStats(mode, s) {
    try { localStorage.setItem('octordle_stats_'+mode, JSON.stringify(s)); } catch(e) {}
}
function recordResult(mode, win, guessCount, maxG) {
    const s = getStats(mode);
    s.played++;
    if (win) {
        s.wins++;
        s.streak++;
        if (s.streak > s.maxStreak) s.maxStreak = s.streak;
        s.dist[guessCount] = (s.dist[guessCount] || 0) + 1;
    } else {
        s.streak = 0;
    }
    saveStats(mode, s);
}

let statsTab = currentMode;
function openStats() {
    statsTab = currentMode;
    renderStats(statsTab);
    document.getElementById('stats-modal').style.display = 'flex';
}
function closeStats() { document.getElementById('stats-modal').style.display = 'none'; }
function switchStatsTab(mode) { statsTab = mode; renderStats(mode); }
function renderStats(mode) {
    document.querySelectorAll('.stats-tab').forEach((t,i) => {
        t.classList.toggle('active', ['classic','chill','extreme'][i] === mode);
    });
    const s = getStats(mode);
    document.getElementById('s-played').textContent = s.played;
    document.getElementById('s-win').textContent = s.played ? Math.round(s.wins/s.played*100)+'%' : '0%';
    document.getElementById('s-streak').textContent = s.streak;
    document.getElementById('s-max').textContent = s.maxStreak;
    const maxG = MODE_GUESSES[mode];
    const maxVal = Math.max(1, ...Object.values(s.dist));
    const bars = document.getElementById('dist-bars');
    bars.innerHTML = '';
    for (let g = 1; g <= maxG; g++) {
        const count = s.dist[g] || 0;
        const pct = Math.round(count / maxVal * 100);
        const row = document.createElement('div'); row.className = 'dist-row';
        row.innerHTML = `<div class="dist-label">${g}</div><div class="dist-bar-wrap"><div class="dist-bar${count>0&&g===lastWinGuess&&mode===currentMode?' highlight':''}" style="width:${Math.max(pct,4)}%">${count||''}</div></div>`;
        bars.appendChild(row);
    }
}

let lastWinGuess = null;
// ---- END STATS ----

window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    handleInput(e.key === "Enter" ? "ENTER" : (e.key === "Backspace" ? "DEL" : e.key.toUpperCase()));
});

init();
</script>
